<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ActiveOn Calculator</title>
</head>
<body>
    <section id="profile-import">
        <h2>Import Game Profile</h2>
        <div class="input-group">
            <textarea
                id="profile-pastebox"
                placeholder="Paste your raw Idleon Toolbox JSON here."
                rows="6"
            ></textarea>
        </div>
        <div class="action-group">
            <button id="btn-import-profile" type="button">Import Profile Data</button>
            <span id="import-status" class="status-neutral">No profile loaded</span>
        </div>
    </section>

    <script type="module" src="app.js"></script>
</body>
</html>
